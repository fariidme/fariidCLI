[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fariid-sec"
version = "1.0.0"
description = "Fariid Tech Security AI — an AI-powered security command center for Kali Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fariid Tech" }]
keywords = ["security", "kali", "pentest", "ai", "deepseek", "cli", "recon", "ctf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
pdf = ["reportlab>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
]

[project.urls]
Homepage = "https://github.com/FariidTech/fariid-security-ai"
Documentation = "https://github.com/FariidTech/fariid-security-ai#readme"
Repository = "https://github.com/FariidTech/fariid-security-ai.git"
Issues = "https://github.com/FariidTech/fariid-security-ai/issues"

[project.scripts]
fariid-sec = "fariid_sec.cli.main:cli"

[tool.setuptools.packages.find]
include = ["fariid_sec*"]

[tool.setuptools.package-data]
fariid_sec = ["tools/*.yaml", "agent/*.txt"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["fariid_sec", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "W"]
ignore = ["S101", "S311", "S603", "S607", "S108", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: requires live tools or network access",
    "ai: requires a live AI provider",
]
